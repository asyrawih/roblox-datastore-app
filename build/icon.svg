<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#6366F1"/>

  <!-- Database Icon (top) -->
  <g transform="translate(256, 120)">
    <!-- Database cylinder top -->
    <ellipse cx="0" cy="0" rx="70" ry="20" fill="#FFFFFF" opacity="0.9"/>
    <!-- Database cylinder body -->
    <rect x="-70" y="0" width="140" height="60" fill="#FFFFFF" opacity="0.9"/>
    <!-- Database cylinder bottom -->
    <ellipse cx="0" cy="60" rx="70" ry="20" fill="#FFFFFF" opacity="0.9"/>
    <!-- Database lines -->
    <ellipse cx="0" cy="20" rx="70" ry="20" fill="none" stroke="#6366F1" stroke-width="3"/>
    <ellipse cx="0" cy="40" rx="70" ry="20" fill="none" stroke="#6366F1" stroke-width="3"/>
  </g>

  <!-- KM Logo (bottom) -->
  <g transform="translate(256, 340)">
    <!-- K letter -->
    <path d="M -80 -40 L -80 40 M -80 0 L -40 -40 M -80 0 L -40 40"
          stroke="#FFFFFF"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- M letter -->
    <path d="M 20 40 L 20 -40 L 50 0 L 80 -40 L 80 40"
          stroke="#FFFFFF"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Connecting line/arrow -->
  <line x1="256" y1="200" x2="256" y2="260" stroke="#FFFFFF" stroke-width="8" opacity="0.7"/>
  <path d="M 256 260 L 246 250 M 256 260 L 266 250" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
</svg>
